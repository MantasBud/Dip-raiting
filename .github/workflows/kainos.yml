name: Universo kainos

on:
  workflow_dispatch:

jobs:
  kainos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Paleisti
        run: python kainos.py | tee kainos.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kainu-pasiskirstymas
          path: kainos.txt
          if-no-files-found: ignore
