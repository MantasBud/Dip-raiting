name: Stop'o vertes backtestas

on:
  workflow_dispatch:
    inputs:
      metai:
        description: "Kiek metu istorijos"
        required: false
        default: "10"

jobs:
  stopas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Patikrinti failus
        run: |
          test -f backtest_stopas.py || (echo "KLAIDA: backtest_stopas.py nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA: universas.py nerastas" && exit 1)
      - name: Europos universas
        env:
          M: ${{ github.event.inputs.metai || '10' }}
        run: python backtest_stopas.py --rinka eu --metai "$M" | tee stopas_eu.txt
      - name: JAV universas
        if: always()
        env:
          M: ${{ github.event.inputs.metai || '10' }}
        run: python backtest_stopas.py --rinka us --metai "$M" | tee stopas_us.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stopo-rezultatai
          path: |
            stopas_eu.txt
            stopas_us.txt
          if-no-files-found: ignore
