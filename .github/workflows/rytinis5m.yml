name: Rytinis tesinys 5 min

on:
  workflow_dispatch:
    inputs:
      valanda:
        description: "Ijejimo valanda Berlyno laiku (10, 11, 12)"
        required: false
        default: "10"
      tikslas:
        description: "Tikslas procentais"
        required: false
        default: "1.0"
      stop:
        description: "Stop procentais"
        required: false
        default: "1.0"

jobs:
  rytinis5m:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Patikrinti failus
        run: |
          test -f backtest_rytinis_5m.py || (echo "KLAIDA - failas nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA - universas.py nerastas" && exit 1)
      - name: Paleisti
        env:
          V: ${{ github.event.inputs.valanda || '10' }}
          TK: ${{ github.event.inputs.tikslas || '1.0' }}
          ST: ${{ github.event.inputs.stop || '1.0' }}
        run: |
          python backtest_rytinis_5m.py --valanda "$V" --tikslas "$TK" \
            --stop "$ST" | tee rytinis5m.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rytinis-5m-rezultatai
          path: rytinis5m.txt
          if-no-files-found: ignore
