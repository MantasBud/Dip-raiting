name: Likvidumo soku backtestas

on:
  workflow_dispatch:
    inputs:
      metai:
        description: "Kiek metu istorijos"
        required: false
        default: "10"

jobs:
  likvidumas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Patikrinti failus
        run: |
          test -f backtest_likvidumas.py || (echo "KLAIDA - failas nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA - universas.py nerastas" && exit 1)
      - name: Europos universas
        env:
          M: ${{ github.event.inputs.metai || '10' }}
        run: python backtest_likvidumas.py --rinka eu --metai "$M" | tee likvidumas_eu.txt
      - name: JAV universas
        if: always()
        env:
          M: ${{ github.event.inputs.metai || '10' }}
        run: python backtest_likvidumas.py --rinka us --metai "$M" | tee likvidumas_us.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: likvidumo-rezultatai
          path: |
            likvidumas_eu.txt
            likvidumas_us.txt
          if-no-files-found: ignore
