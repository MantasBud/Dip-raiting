name: Vertes nuolaidos backtestas

on:
  workflow_dispatch:
    inputs:
      metai:
        description: "Kiek metu istorijos"
        required: false
        default: "5"

jobs:
  verte:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Patikrinti failus
        run: |
          test -f backtest_verte.py || (echo "KLAIDA - backtest_verte.py nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA - universas.py nerastas" && exit 1)
      - name: Europos universas
        env:
          M: ${{ github.event.inputs.metai || '5' }}
        run: python backtest_verte.py --rinka eu --metai "$M" | tee verte_eu.txt
      - name: JAV universas
        if: always()
        env:
          M: ${{ github.event.inputs.metai || '5' }}
        run: python backtest_verte.py --rinka us --metai "$M" | tee verte_us.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vertes-rezultatai
          path: |
            verte_eu.txt
            verte_us.txt
          if-no-files-found: ignore
