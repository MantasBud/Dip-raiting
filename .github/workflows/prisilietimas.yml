name: Pirmo prisilietimo backtestas

on:
  workflow_dispatch:
    inputs:
      metai:
        description: "Kiek metu istorijos"
        required: false
        default: "10"
      tikslas:
        description: "Tikslas procentais (pvz 1.0)"
        required: false
        default: "1.0"
      skausmas:
        description: "Skausmo riba procentais (pvz -2.8)"
        required: false
        default: "-2.8"

jobs:
  testas:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      M: ${{ github.event.inputs.metai || '10' }}
      T: ${{ github.event.inputs.tikslas || '1.0' }}
      S: ${{ github.event.inputs.skausmas || '-2.8' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy tzdata

      - name: Patikrinti failus
        run: |
          test -f backtest_prisilietimas.py || (echo "KLAIDA - backtest_prisilietimas.py nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA - universas.py nerastas" && exit 1)

      - name: Europos universas
        run: python backtest_prisilietimas.py --rinka eu --metai "$M" --tikslas "$T" --skausmas "$S" | tee prisilietimas_eu.txt

      - name: JAV universas
        run: python backtest_prisilietimas.py --rinka us --metai "$M" --tikslas "$T" --skausmas "$S" | tee prisilietimas_us.txt

      - uses: actions/upload-artifact@v4
        with:
          name: prisilietimas
          path: |
            prisilietimas_eu.txt
            prisilietimas_us.txt
