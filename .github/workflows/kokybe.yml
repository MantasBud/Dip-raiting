name: Kokybes rodikliu backtestas

on:
  workflow_dispatch:
    inputs:
      metai:
        description: "Kiek metu istorijos"
        required: false
        default: "8"

jobs:
  kokybe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Patikrinti failus
        run: |
          test -f backtest_kokybe.py || (echo "KLAIDA - failas nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA - universas.py nerastas" && exit 1)
      - name: Europos universas
        env:
          M: ${{ github.event.inputs.metai || '8' }}
        run: python backtest_kokybe.py --rinka eu --metai "$M" | tee kokybe_eu.txt
      - name: JAV universas
        if: always()
        env:
          M: ${{ github.event.inputs.metai || '8' }}
        run: python backtest_kokybe.py --rinka us --metai "$M" | tee kokybe_us.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kokybes-rezultatai
          path: |
            kokybe_eu.txt
            kokybe_us.txt
          if-no-files-found: ignore
