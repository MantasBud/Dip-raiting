name: Tesinio backtestas

on:
  workflow_dispatch:
    inputs:
      metai:
        description: "Kiek metu istorijos"
        required: false
        default: "10"
      sanaudos:
        description: "Mokesciai ir spread'as procentais"
        required: false
        default: "0.07"

jobs:
  tesinys:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Idiegti bibliotekas
        run: pip install yfinance pandas numpy tzdata

      - name: Patikrinti ar failas vietoje
        run: |
          ls -la
          test -f backtest_tesinys_daily.py || \
            (echo "KLAIDA: backtest_tesinys_daily.py nerastas" && exit 1)

      - name: JAV universas (NEPRIKLAUSOMAS patikrinimas)
        env:
          METAI: ${{ github.event.inputs.metai || '10' }}
          SANAUDOS: ${{ github.event.inputs.sanaudos || '0.07' }}
        run: |
          python backtest_tesinys_daily.py --rinka us --metai "$METAI" \
            --sanaudos "$SANAUDOS" | tee tesinys_us.txt

      - name: Europos universas (palyginimui)
        if: always()
        env:
          METAI: ${{ github.event.inputs.metai || '10' }}
          SANAUDOS: ${{ github.event.inputs.sanaudos || '0.07' }}
        run: |
          python backtest_tesinys_daily.py --rinka eu --metai "$METAI" \
            --sanaudos "$SANAUDOS" | tee tesinys_eu.txt

      - name: Issaugoti rezultatus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tesinio-rezultatai
          path: |
            tesinys_us.txt
            tesinys_eu.txt
          if-no-files-found: ignore
