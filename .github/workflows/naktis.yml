name: Nakties lango backtestas

on:
  workflow_dispatch:
    inputs:
      metai:
        description: "Kiek metu istorijos"
        required: false
        default: "10"
      sanaudos_eur:
        description: "Sanaudos EURAIS visam ciklui"
        required: false
        default: "5"

jobs:
  naktis:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install yfinance pandas numpy tzdata

      - name: Patikrinti failus
        run: |
          ls -la
          test -f backtest_naktis.py || (echo "KLAIDA: backtest_naktis.py nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA: universas.py nerastas" && exit 1)

      - name: Europos universas
        env:
          M: ${{ github.event.inputs.metai || '10' }}
          S: ${{ github.event.inputs.sanaudos_eur || '5' }}
        run: |
          python backtest_naktis.py --rinka eu --metai "$M" --sanaudos-eur "$S" \
            | tee naktis_eu.txt

      - name: JAV universas (nepriklausomas patikrinimas)
        if: always()
        env:
          M: ${{ github.event.inputs.metai || '10' }}
          S: ${{ github.event.inputs.sanaudos_eur || '5' }}
        run: |
          python backtest_naktis.py --rinka us --metai "$M" --sanaudos-eur "$S" \
            | tee naktis_us.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nakties-rezultatai
          path: |
            naktis_eu.txt
            naktis_us.txt
          if-no-files-found: ignore
