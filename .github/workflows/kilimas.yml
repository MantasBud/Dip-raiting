name: Dienos kilimo backtestas

on:
  workflow_dispatch:

jobs:
  kilimas:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Patikrinti failus
        run: |
          test -f backtest_kilimas.py || (echo "KLAIDA - failas nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA - universas.py nerastas" && exit 1)
      - name: Europos universas
        run: python backtest_kilimas.py --rinka eu | tee kilimas_eu.txt
      - name: JAV universas
        if: always()
        run: python backtest_kilimas.py --rinka us | tee kilimas_us.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kilimo-rezultatai
          path: |
            kilimas_eu.txt
            kilimas_us.txt
          if-no-files-found: ignore
