name: Backtestas

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Idiegti bibliotekas
        run: pip install yfinance pandas numpy tzdata

      - name: Ilgas testas (2 metai, valandiniai barai)
        run: python backtest_intraday.py --interval 60m --target 3 --sweep

      - name: Tikslus testas (60 d., 5 min. barai)
        if: always()
        run: python backtest_intraday.py --interval 5m --target 3
