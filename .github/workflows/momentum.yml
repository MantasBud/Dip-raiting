name: Dienos momentumo backtestas

on:
  workflow_dispatch:

jobs:
  momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy tzdata
      - name: Patikrinti failus
        run: |
          test -f backtest_dienos_momentum.py || (echo "KLAIDA: failas nerastas" && exit 1)
          test -f universas.py || (echo "KLAIDA: universas.py nerastas" && exit 1)
      - name: Europos rinka
        run: python backtest_dienos_momentum.py --rinka eu | tee momentum_eu.txt
      - name: JAV rinka
        if: always()
        run: python backtest_dienos_momentum.py --rinka us | tee momentum_us.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: momentumo-rezultatai
          path: |
            momentum_eu.txt
            momentum_us.txt
          if-no-files-found: ignore
